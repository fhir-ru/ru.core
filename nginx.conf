events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    server {
        listen 8080;
        server_name fhir.ru "";
        root /site;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location = /readme {
            return 301 /wiki/readme;
        }

        location /healthz {
            access_log off;
            return 200 "ok";
        }
    }

    server {
        listen 8080;
        server_name rucore.fhir.ru;
        root /site/ig/core;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location /healthz {
            access_log off;
            return 200 "ok";
        }
    }
}
