events {
    worker_connections  1024;
}

http {
    server {
        listen 8081;

        location / {
            root /app/RuCoreIG/output;
            include /etc/nginx/mime.types;
        }
    }

    server {
        listen 8084;

        location / {
            root /app/IGIndex;
            include /etc/nginx/mime.types;
        }
    }

    server {
        listen 8085;

        location / {
            root /app/newLanding;
            include /etc/nginx/mime.types;
        }
    }
}
