name: Build IG

on:
  push:
    branches:
      - main
    paths:
      - 'RuCoreIG/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 21

      - name: Install SUSHI
        run: npm install -g fsh-sushi@latest

      - name: Download IG Publisher
        run: cd RuCoreIG && ./_updatePublisher.sh -y

      - name: Build IG
        run: cd RuCoreIG && ./_genonce.sh

      - name: Push output to build branch
        run: |
          cd RuCoreIG/output
          git init -b build
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "IG build from ${{ github.sha }}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build
